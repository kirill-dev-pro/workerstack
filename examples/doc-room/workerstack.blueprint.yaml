version: 2
generator:
  name: workerstack
  version: 0.3.0
application:
  framework: bun-ssr
  scripts:
    build: build
  worker:
    render: spa
    main: src/server.ts
    compatibilityDate: 2026-09-27
    assets: dist/client
    durableObjects:
      - binding: DOC_ROOM
        className: DocRoom
authentication:
  managedIdentity:
    protocolVersion: 2
    adapterVersion: 2
    discovery: true
    callbackPath: /api/auth/callback/bunderhost
workerstack:
  entry: src/workerstack.ts
  manifestVersion: 4
resources:
  database:
    dialect: sqlite
    migrationsDirectory: ./migrations
    migrationMode: push
    tables:
      - exportName: _system.idempotency
        physicalName: _bunderstack_idempotency
        system: true
      - exportName: _system.jobs
        physicalName: _bunderstack_jobs
        system: true
      - exportName: _system.messageEvents
        physicalName: _bunderstack_message_events
        system: true
      - exportName: _system.messages
        physicalName: _bunderstack_messages
        system: true
      - exportName: account
        physicalName: account
        system: false
      - exportName: _system.files
        physicalName: bunderstack_file_meta
        system: true
      - exportName: session
        physicalName: session
        system: false
      - exportName: user
        physicalName: user
        system: false
      - exportName: verification
        physicalName: verification
        system: false
  storage:
    defaultBucket: default
    buckets:
      - name: default
        visibility: private
  messaging:
    channels: []
environment:
  - key: APP_URL
    required: false
    scope: server
    sensitive: true
  - key: BUNDERHOST_AUTH_CONFIG
    required: false
    scope: server
    sensitive: true
api:
  operations: []
background:
  jobs: []
  cron: []
  maintenance:
    - name: storage-sweep
      schedule: "0 4 * * *"
      timezone: UTC
